services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: yatrakavach
      POSTGRES_USER: yk
      POSTGRES_PASSWORD: yk_dev_only   # local demo only; never use in production
    ports: ["${YK_DB_PORT:-5432}:5432"]   # set YK_DB_PORT if a local PostgreSQL already uses 5432
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yk -d yatrakavach"]
      interval: 3s
      retries: 20
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://yk:yk_dev_only@db:5432/yatrakavach
      PYTHONPATH: /app                  # lets scripts/load_*.py import the app package inside the container
    ports: ["${YK_API_PORT:-8000}:8000"]
    volumes:
      - ./data:/app/data:ro
      - ./config:/app/config:ro
      - ./frontend:/app/frontend:ro
      - ./scripts:/app/scripts:ro
    depends_on:
      db: {condition: service_healthy}
